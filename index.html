<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay Slip Pro</title>
    <script>
      (function() {
        var p = window.location.pathname;
        if (p.startsWith('/biometric') || p.startsWith('/punch') || p.startsWith('/attendance-portal')) {
          var link = document.querySelector("link[rel*='icon']");
          if (link) {
            link.type = 'image/png';
            link.href = '/biometric-favicon.png';
          }
          var apple = document.querySelector("link[rel='apple-touch-icon']");
          if (apple) {
            apple.href = '/biometric-favicon.png';
          }
          document.title = 'Attendance & Biometric Portal';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
